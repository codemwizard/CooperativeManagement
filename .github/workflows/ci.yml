name: Symphony Phase 0 Gate

on:
  push:
    branches: [main, master, 'phase/*']
  pull_request:
    branches: [main, master]

defaults:
  run:
    shell: bash

jobs:
  phase0-gate:
    name: Reproducible Phase 0 foundation
    runs-on: ubuntu-latest
    env:
      DATA_MODE: test
      PHASE1_TEST_ADMIN_DATABASE_URL: postgresql://symphony:symphony_dev@localhost:5433/symphony_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'
          cache: npm
      - name: Prepare the pinned npm CLI in the runner temp directory
        run: bash tools/prepare_ci_npm.sh
      - name: Verify installed Node and npm
        run: |
          node --version
          test "$(command -v npm)" = "$NPM_BIN"
          npm --version
      - run: npm ci
      - name: Verify the local PostgreSQL lifecycle commands
        run: npm run db:start && npm run db:stop
      - name: Start the isolated PostgreSQL 18.0 test service
        run: npm run db:test:start
      - name: Provision WP1.5 ephemeral roles
        run: node tools/bootstrap_wp1_5_database.mjs
      - name: Install Playwright browser for the legacy regression floor
        run: npx playwright install --with-deps chromium
      - name: Prepare retained gate evidence
        run: mkdir -p artifacts
      - name: Run the mandatory Phase 0 gate
        id: phase0
        shell: bash
        run: npm run verify:phase0 2>&1 | tee artifacts/phase0-gate.raw.log
      - name: Revoke temporary migration membership and verify WP1.5 role attributes
        if: always()
        run: node tools/finalize_wp1_5_database.mjs
      - name: Write sanitized Phase 0 CI evidence
        if: always()
        env:
          PHASE0_GATE_OUTCOME: ${{ steps.phase0.outcome }}
        run: node tools/write_ci_evidence.mjs
      - name: Retain Phase 0 CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-evidence-${{ github.sha }}
          path: |
            artifacts/phase0-ci-evidence.json
            artifacts/phase0-gate.sanitized.log
            artifacts/phase0-gate.raw.log
          if-no-files-found: error
          retention-days: 90
      - name: Stop the isolated PostgreSQL service
        if: always()
        run: npm run db:test:stop

  db-integration:
    name: Restricted-role DB integration and WP1.5 tenant isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.0-alpine
        env:
          POSTGRES_DB: symphony_test
          POSTGRES_USER: symphony
          POSTGRES_PASSWORD: symphony_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_SCHEMA: symphony
      DATA_MODE: test
      NODE_ENV: test
      SYNTHETIC_ONLY: 'true'
      PHASE1_TEST_ADMIN_DATABASE_URL: postgresql://symphony:symphony_test@localhost:5432/symphony_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'
          cache: npm
      - name: Prepare the pinned npm CLI in the runner temp directory
        run: bash tools/prepare_ci_npm.sh
      - name: Verify installed Node and npm
        run: |
          node --version
          test "$(command -v npm)" = "$NPM_BIN"
          npm --version
      - run: npm ci
      - name: Prepare WP1.5 raw evidence
        run: mkdir -p artifacts
      - name: Provision disposable migration, application and outbox-writer roles
        run: node tools/bootstrap_wp1_5_database.mjs 2>&1 | tee artifacts/role-bootstrap.raw.log
      - name: Apply migrations from an empty database
        run: npm run db:migrate:test 2>&1 | tee artifacts/db-migrate.raw.log
      - name: Install Chromium for real authentication browser acceptance
        run: npx playwright install --with-deps chromium
      - name: Run actual-role DB integration checks
        run: npm run test:db --workspace @symphony/db 2>&1 | tee artifacts/db-integration.raw.log
      - name: Run WP5.4 workspace login/password flow against PostgreSQL
        run: npm run test:login:api 2>&1 | tee artifacts/wp5.4-browser.raw.log
      - name: Run WP5.5 frozen temporary-credential BDD through the real stack
        env:
          WP5_5_ARTIFACT_DIR: artifacts/wp5.5
        run: npm run test:wp5.5 2>&1 | tee artifacts/wp5.5-bdd.raw.log
      - name: Run WP6.1 served workspace routes and accessibility acceptance
        env:
          WP6_1_ARTIFACT_DIR: artifacts/wp6.1
        run: npm run test:wp6.1 2>&1 | tee artifacts/wp6.1-routes.raw.log
      - name: Run WP1.5 cross-organisation PostgreSQL BDD
        run: npm run test:bdd:wp1.5 2>&1 | tee artifacts/bdd-wp1.5.raw.log
      - name: Revoke temporary migration membership and verify final role attributes
        if: always()
        run: node tools/finalize_wp1_5_database.mjs 2>&1 | tee artifacts/role-finalizer.raw.log
      - name: Retain WP1.5 raw database evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp1.5-db-evidence-${{ github.sha }}
          path: |
            artifacts/*.raw.log
            artifacts/wp5.4/*
            artifacts/wp5.5/*
            artifacts/wp6.1/*
          if-no-files-found: warn
          retention-days: 90

  legacy-e2e:
    name: Existing full legacy E2E suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'
          cache: npm
      - name: Prepare the pinned npm CLI in the runner temp directory
        run: bash tools/prepare_ci_npm.sh
      - name: Verify installed Node and npm
        run: |
          node --version
          test "$(command -v npm)" = "$NPM_BIN"
          npm --version
      - run: npm ci
      - name: Prepare legacy verification evidence
        run: mkdir -p artifacts
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run the full legacy suite, including Phase 1 E2E
        run: npm run verify:all 2>&1 | tee artifacts/verify-all.raw.log
      - name: Retain legacy verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-all-evidence-${{ github.sha }}
          path: artifacts/verify-all.raw.log
          if-no-files-found: warn
          retention-days: 90
